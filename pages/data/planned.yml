# Planned workers, for the Planned features page (see hooks/minecraft.py).
# `icon` stands for the work, `workstation` is a vanilla block icon or omitted for a
# new block of the mod. Values may use :mc-<name>: icons.
next:
  mine_logistician:
    name: Mine logistician
    icon: minecart
    station: Haulage winch (new block)
    summary: Keeps long tunnels going with depot chests, later with rails, minecarts and a lift between the levels of a mine.
  crafter_operator:
    name: Crafter operator
    icon: crafting_table
    workstation: crafter
    station: Crafter
    summary: Fills a vanilla crafter from its chests and triggers it, without hopper sorting.
  merchant:
    name: Merchant
    icon: map
    station: Trading office (new block)
    summary: Takes goods to neighbouring villages by caravan and sells them where they are wanted.

later:
  tanner: {name: Tanner, workstation: cauldron, work: ":mc-leather: Works leather"}
  cartographer: {name: Cartographer, workstation: cartography_table, work: ":mc-filled_map: Explores the land and finds villages"}
  librarian: {name: Librarian, workstation: lectern, work: ":mc-book: Keeps a list of what is in your storage"}
