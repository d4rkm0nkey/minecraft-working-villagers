# Planned workers, for the Planned features page (see hooks/minecraft.py).
# `icon` stands for the work, `workstation` is a vanilla block icon or omitted for a
# new block of the mod. Values may use :mc-<name>: icons.
next:
  miner:
    name: Miner
    icon: iron_pickaxe
    station: Mining bench (new block)
    summary: Quarries stone and digs tunnels in a set pattern, places torches and seals off lava and water.
  pit_digger:
    name: Pit digger
    icon: iron_shovel
    station: Pit stake (new block)
    summary: Digs out a pit you mark with string, layer by layer, with a ladder as the way out. For basements, foundations, sand and clay pits.
  mine_logistician:
    name: Mine logistician
    icon: minecart
    station: Haulage winch (new block)
    summary: Keeps long tunnels going with depot chests, later with rails, minecarts and a lift between the levels of a mine.
  kiln_operator:
    name: Kiln operator
    icon: bricks
    station: Kiln (new block)
    summary: Fires glass, smooth stone, bricks, terracotta and charcoal in a brick kiln.
  shop_assistant:
    name: Shop assistant
    icon: emerald
    workstation: lectern
    station: Trading counter or lectern
    summary: Sells goods from a chest through the trades of the villagers around it and brings in emeralds.
  crafter_operator:
    name: Crafter operator
    icon: crafting_table
    workstation: crafter
    station: Crafter
    summary: Fills a vanilla crafter from its chests and triggers it, without hopper sorting.
  merchant:
    name: Merchant
    icon: map
    station: Trading office (new block)
    summary: Takes goods to neighbouring villages by caravan and sells them where they are wanted.

later:
  fisher: {name: Fisher, workstation: barrel, work: ":mc-fishing_rod: Fishes at marked water"}
  shepherd: {name: Shepherd, workstation: loom, work: ":mc-shears: Shears sheep and sorts the wool"}
  butcher: {name: Butcher, workstation: smoker, work: ":mc-cod: Breeds animals and smokes the meat"}
  tanner: {name: Tanner, workstation: cauldron, work: ":mc-leather: Works leather"}
  fletcher: {name: Fletcher, workstation: fletching_table, work: ":mc-arrow: Makes arrows"}
  cartographer: {name: Cartographer, workstation: cartography_table, work: ":mc-filled_map: Explores the land and finds villages"}
  cleric: {name: Cleric, workstation: brewing_stand, work: ":mc-experience_bottle: Brews potions"}
  librarian: {name: Librarian, workstation: lectern, work: ":mc-book: Keeps a list of what is in your storage"}
  guard: {name: Guard, work: ":mc-iron_sword: Protects mines and caravans (an idea so far)"}
